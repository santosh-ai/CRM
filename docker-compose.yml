version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: ndis_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./backend/migrations/002_security.sql:/docker-entrypoint-initdb.d/002_security.sql
    # Bind only to localhost so the DB is not reachable from outside the host
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/ndis_crm
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env - use: openssl rand -hex 32}
      PORT: 5000
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-}
    volumes:
      - uploads:/app/uploads
    # Backend is only accessed via the frontend nginx proxy, not directly
    expose:
      - "5000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
