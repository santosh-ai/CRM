server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── HTTP security headers ──────────────────────────────────────────────────
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Block the page from being framed (clickjacking protection)
    add_header X-Frame-Options "DENY" always;
    # Don't send a Referer header when navigating away
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Restrict browser features (camera/mic/geolocation are not needed)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content-Security-Policy: restrict resource sources to self
    # 'unsafe-inline' on style-src is required by Tailwind CSS utilities injected at runtime.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self';" always;
    # HSTS — tell browsers to only use HTTPS for the next year.
    # This header is forwarded by the upstream TLS terminator (load balancer / reverse proxy).
    # Remove or shorten max-age if you are testing over plain HTTP without a TLS proxy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
    }

    location /uploads {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
